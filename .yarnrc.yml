nodeLinker: node-modules
npmMinimalAgeGate: "3d"

# @fast-check/vitest 0.4.1 works with Vitest 5; the peer-range fix is merged
# but not yet published: https://github.com/dubzzz/fast-check/pull/7244.
# Remove this filter when a release includes the updated peer declaration.
logFilters:
  - pattern: "vitest is listed by your project with version 5.0.0 *what @fast-check/vitest*request*"
    level: discard
